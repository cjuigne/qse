buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Version 9.5.0 compatible avec Gradle 9.2.0
        classpath "com.gradleup.shadow:shadow-gradle-plugin:9.5.0"
    }
}

apply plugin: "com.gradleup.shadow"
apply plugin: 'java'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

group 'dk.aau.cs.relweb'
version 'fix_shClassAttribute-QSE'

repositories {
    mavenCentral()
}

dependencies {
    // Attention : on a retiré le "ext: 'pom'" sur nxparser qui faisait crasher le zip
    implementation group: 'org.semanticweb.yars', name: 'nxparser-model', version: '4.0.0'
    implementation group: 'org.semanticweb.yars', name: 'nxparser-parsers', version: '4.0.0'
    implementation group: 'com.google.guava', name: 'guava', version: '30.1-jre'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.12.0'
    implementation group: 'org.apache.commons', name: 'commons-collections4', version: '4.4'
    implementation group: 'org.eclipse.rdf4j', name: 'rdf4j-model', version: '3.6.2'
    implementation group: 'org.eclipse.rdf4j', name: 'rdf4j-rio-turtle', version: '3.6.2'

    // These are for RDF4J and GraphDB
    implementation group: 'org.eclipse.rdf4j', name: 'rdf4j-repository-sparql', version: '3.0.0'
    implementation group: 'com.ontotext.graphdb', name: 'graphdb-free-runtime', version: '9.3.0'
    implementation group: 'com.opencsv', name: 'opencsv', version: '5.5.1'

    implementation files('libs/turtle-formatter-snapshot.jar') // Customized turtle-formatter
    implementation group: 'org.apache.jena', name: 'jena-shacl', version: '4.6.1'
}

shadowJar {
    dependencies {
        // Empêche Shadow d'essayer de dézipper le fichier .pom transitoire de RDF4J
        exclude(dependency('org.eclipse.rdf4j:rdf4j-storage:.*'))
    }
    
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': 'cs.Main'
    }
    archiveClassifier.set('all')
    zip64 true
}