buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Version 9.5.0 compatible avec Gradle 9.2.0
        classpath "com.gradleup.shadow:shadow-gradle-plugin:9.5.0"
    }
}

apply plugin: "com.gradleup.shadow"
apply plugin: 'java'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

group 'dk.aau.cs.relweb'
version 'main20261113'


repositories {
    mavenCentral()
}

ext.rdf4jVersion = '3.6.2'

dependencies {
    // Warning : we deleted the "ext: 'pom'" on nxparser dependencies because it was causing a problem with the shadow plugin.

    implementation group: 'org.semanticweb.yars', name: 'nxparser-model', version: '4.0.0'
    implementation group: 'org.semanticweb.yars', name: 'nxparser-parsers', version: '4.0.0'
    implementation group: 'com.google.guava', name: 'guava', version: '30.1-jre'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.12.0'
    implementation group: 'org.apache.commons', name: 'commons-collections4', version: '4.4'
    implementation group: 'com.opencsv', name: 'opencsv', version: '5.5.1'
    
    // RDG4J dependencies
    implementation "org.eclipse.rdf4j:rdf4j-model:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-rio-turtle:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-rio-ntriples:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-repository-sparql:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-repository-sail:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-sail-memory:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-sail-nativerdf:${rdf4jVersion}"

    // GraphDB (RemoteRepositoryManager)
    implementation "org.eclipse.rdf4j:rdf4j-repository-manager:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-repository-http:${rdf4jVersion}"

    // Output query formats
    implementation "org.eclipse.rdf4j:rdf4j-queryresultio-sparqlxml:${rdf4jVersion}"
    implementation "org.eclipse.rdf4j:rdf4j-queryresultio-sparqljson:${rdf4jVersion}"

    // Logging: SLF4J implementation used in Main.java
    implementation 'ch.qos.logback:logback-classic:1.2.13'
    // @NotNull annotation (QbParser.java), needed at compile time only
    compileOnly 'org.jetbrains:annotations:24.1.0'

    // These are for RDF4J and GraphDB
    // implementation group: 'org.eclipse.rdf4j', name: 'rdf4j-repository-sparql', version: '3.0.0'
    // implementation group: 'com.ontotext.graphdb', name: 'graphdb-free-runtime', version: '9.3.0'
    // implementation group: 'com.opencsv', name: 'opencsv', version: '5.5.1'

    implementation files('libs/turtle-formatter-snapshot.jar') // Customized turtle-formatter
    implementation group: 'org.apache.jena', name: 'jena-shacl', version: '4.6.1'
}

shadowJar {
    dependencies {
        // Prevent Shadow from trying to unzip the transient .pom file of RDF4J
        // exclude(dependency('org.eclipse.rdf4j:rdf4j-storage:.*'))
    }
    
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': 'cs.Main'
    }
    archiveClassifier.set('all')
    zip64 true
}